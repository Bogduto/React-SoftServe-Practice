name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Vite dev server and wait for readiness
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000
          echo "Server responded, waiting extra time for React to load..."
          sleep 20      
      - name: Run Cucumber e2e tests
        run: npm run test:e2e
